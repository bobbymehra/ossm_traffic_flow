<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1112 390" width="1112" height="390">
  <title id="title">NodePort traffic into the mesh</title>
  <desc id="desc">The NodePort Service and the ingress gateway live in the gateway namespace. The application pod lives in the application namespace. The client connects to a node IP and NodePort. The node forwards to the gateway, which opens mTLS to the pod Envoy.</desc>
  <rect width="1112" height="390" fill="#ffffff"/>
  <defs>
    <marker id="np-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8" fill="none" stroke="#1f2328" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="186" y="16" width="910" height="358" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="202" y="38" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">OpenShift cluster</text>

  <rect x="210" y="52" width="520" height="300" rx="10" fill="#eef1f4" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="226" y="76" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">Gateway namespace</text>
  <text x="226" y="94" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif">Service and gateway pods</text>

  <rect x="780" y="52" width="290" height="300" rx="10" fill="#eef1f4" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="796" y="76" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">Application namespace</text>

  <g fill="none" stroke="#1f2328" stroke-width="1.5">
    <path marker-end="url(#np-arrow)" d="M 160 200 H 268"/>
    <path marker-end="url(#np-arrow)" d="M 436 200 H 520"/>
    <path marker-end="url(#np-arrow)" d="M 696 198 H 748 V 168 H 808"/>
    <path marker-end="url(#np-arrow)" d="M 892 200 V 236"/>
  </g>

  <g>
    <rect x="12" y="168" width="148" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="86" y="196" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">External client</text>
    <text x="86" y="214" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">node IP : port</text>
  </g>
  <g>
    <rect x="268" y="164" width="168" height="72" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="352" y="194" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">NodePort Service</text>
    <text x="352" y="212" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">on every node</text>
  </g>
  <g>
    <rect x="520" y="156" width="176" height="84" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
    <text x="608" y="190" fill="#ffffff" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Ingress gateway</text>
    <text x="608" y="208" fill="#ffffff" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">host and path</text>
  </g>
  <g>
    <rect x="808" y="136" width="168" height="64" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
    <text x="892" y="162" fill="#ffffff" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Pod Envoy</text>
    <text x="892" y="180" fill="#ffffff" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">checks identity</text>
  </g>
  <g>
    <rect x="808" y="236" width="168" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="892" y="262" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Application</text>
    <text x="892" y="280" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">receives localhost</text>
  </g>

  <g>
    <circle cx="214" cy="200" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="214" y="204" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">1</text>
    <text x="214" y="182" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">TCP</text>
  </g>
  <g>
    <circle cx="478" cy="200" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="478" y="204" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">2</text>
    <text x="478" y="182" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">forward</text>
  </g>
  <g>
    <circle cx="748" cy="182" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="748" y="186" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">3</text>
    <text x="736" y="156" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="end">mTLS</text>
  </g>
  <g>
    <circle cx="916" cy="218" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="916" y="222" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">4</text>
    <text x="930" y="222" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif">local</text>
  </g>
</svg>
