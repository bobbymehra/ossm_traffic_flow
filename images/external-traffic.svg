<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1040 432" width="1040" height="432">
  <title id="title">External traffic into the mesh</title>
  <desc id="desc">The client reaches the OpenShift router or a LoadBalancer. An edge route ends TLS at the router and forwards HTTP. A passthrough route forwards TLS to the ingress gateway. The gateway then opens mTLS to the pod Envoy, which forwards to the application.</desc>
  <rect width="1040" height="432" fill="#ffffff"/>
  <defs>
    <marker id="ossm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8" fill="none" stroke="#1f2328" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="200" y="16" width="820" height="400" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="216" y="38" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">OpenShift cluster</text>

  <rect x="800" y="100" width="196" height="248" rx="10" fill="#eef1f4" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="814" y="122" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">Application pod</text>

  <g fill="none" stroke="#1f2328" stroke-width="1.5">
    <path marker-end="url(#ossm-arrow)" d="M 172 220 H 190 V 80 H 232"/>
    <path marker-end="url(#ossm-arrow)" d="M 190 220 V 360 H 232"/>
    <path marker-end="url(#ossm-arrow)" d="M 412 80 H 560 V 156"/>
    <path marker-end="url(#ossm-arrow)" d="M 322 112 V 304 H 560 V 240"/>
    <path marker-end="url(#ossm-arrow)" d="M 412 360 H 656 V 240"/>
    <path marker-end="url(#ossm-arrow)" d="M 696 198 H 760 V 170 H 816"/>
    <path marker-end="url(#ossm-arrow)" d="M 898 200 V 236"/>
  </g>

  <g>
    <rect x="16" y="188" width="156" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="94" y="216" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">External client</text>
    <text x="94" y="234" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">outside the cluster</text>
  </g>
  <g>
    <rect x="232" y="48" width="180" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="322" y="76" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">OpenShift router</text>
    <text x="322" y="94" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">edge or passthrough</text>
  </g>
  <g>
    <rect x="232" y="328" width="180" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="322" y="356" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">LoadBalancer</text>
    <text x="322" y="374" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">skips the router</text>
  </g>
  <g>
    <rect x="520" y="156" width="176" height="84" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
    <text x="608" y="192" fill="#ffffff" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Ingress gateway</text>
    <text x="608" y="210" fill="#ffffff" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">host and path</text>
  </g>
  <g>
    <rect x="816" y="140" width="164" height="60" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
    <text x="898" y="166" fill="#ffffff" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Pod Envoy</text>
    <text x="898" y="182" fill="#ffffff" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">checks identity</text>
  </g>
  <g>
    <rect x="816" y="236" width="164" height="60" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="898" y="262" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Application</text>
    <text x="898" y="278" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">receives localhost</text>
  </g>

  <g>
    <circle cx="190" cy="150" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="190" y="154" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">1</text>
    <text x="176" y="146" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="end">TLS</text>
  </g>
  <g>
    <circle cx="560" cy="118" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="560" y="122" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">2</text>
    <text x="548" y="104" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="end">edge</text>
    <text x="548" y="118" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="end">HTTP</text>
  </g>
  <g>
    <circle cx="470" cy="304" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="470" y="308" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">2</text>
    <text x="458" y="290" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="end">passthrough</text>
    <text x="458" y="304" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="end">TLS</text>
  </g>
  <g>
    <circle cx="760" cy="184" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="760" y="188" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">3</text>
    <text x="748" y="168" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="end">mTLS</text>
  </g>
  <g>
    <circle cx="922" cy="218" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="922" y="222" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">4</text>
    <text x="936" y="222" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif">local</text>
  </g>
</svg>
