<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 940 340" width="940" height="340">
  <title id="title">East-west traffic inside the mesh</title>
  <desc id="desc">App A calls Service B. The pod redirects that call to Envoy on A, which opens mTLS to Envoy on B, and Envoy on B forwards to App B on localhost.</desc>
  <rect width="940" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ew-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8" fill="none" stroke="#1f2328" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="908" height="308" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="32" y="40" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">OpenShift cluster</text>

  <rect x="36" y="56" width="400" height="240" rx="10" fill="#eef1f4" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="52" y="80" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">Pod A</text>

  <rect x="500" y="56" width="404" height="240" rx="10" fill="#eef1f4" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="516" y="80" fill="#656d76" font-size="12" font-family="Helvetica, Arial, sans-serif">Pod B</text>

  <g fill="none" stroke="#1f2328" stroke-width="1.5">
    <path marker-end="url(#ew-arrow)" d="M 212 172 H 268"/>
    <path marker-end="url(#ew-arrow)" d="M 416 172 H 520"/>
    <path marker-end="url(#ew-arrow)" d="M 668 172 H 740"/>
  </g>

  <g>
    <rect x="56" y="140" width="156" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="134" y="168" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">App A</text>
    <text x="134" y="186" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">calls Service B</text>
  </g>
  <g>
    <rect x="268" y="136" width="148" height="72" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
    <text x="342" y="164" fill="#ffffff" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Envoy on A</text>
    <text x="342" y="182" fill="#ffffff" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">starts mTLS</text>
  </g>
  <g>
    <rect x="520" y="136" width="148" height="72" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
    <text x="594" y="164" fill="#ffffff" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Envoy on B</text>
    <text x="594" y="182" fill="#ffffff" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">checks identity</text>
  </g>
  <g>
    <rect x="740" y="140" width="148" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="814" y="168" fill="#1f2328" font-size="13" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">App B</text>
    <text x="814" y="186" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">on localhost</text>
  </g>

  <g>
    <circle cx="240" cy="172" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="240" y="176" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">1</text>
    <text x="240" y="124" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">redirect</text>
  </g>
  <g>
    <circle cx="468" cy="172" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="468" y="176" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">2</text>
    <text x="468" y="148" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">mTLS</text>
  </g>
  <g>
    <circle cx="704" cy="172" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.25"/>
    <text x="704" y="176" fill="#1f2328" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">3</text>
    <text x="704" y="124" fill="#656d76" font-size="11" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">local</text>
  </g>
</svg>
